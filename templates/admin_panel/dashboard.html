{% extends "admin_panel/base_admin.html" %}
{% block title %}ภาพรวมแดชบอร์ด{% endblock %}

{% block content %}
<div class="page-header">
  <div>
    <h1>ภาพรวมแดชบอร์ด</h1>
    <p>ยินดีต้อนรับ, {{ request.user.get_full_name|default:request.user.username }}</p>
  </div>
</div>

<div class="row g-3">
  <div class="col-md-3">
    <div class="summary-card">
      <div class="summary-icon"><i class="bi bi-building"></i></div>
      <div><div class="val">—</div><div class="lbl">คณะทั้งหมด</div></div>
    </div>
  </div>
  <div class="col-md-3">
    <div class="summary-card">
      <div class="summary-icon" style="background:#F0FDF4;color:#16A34A;"><i class="bi bi-diagram-3"></i></div>
      <div><div class="val">—</div><div class="lbl">สาขาทั้งหมด</div></div>
    </div>
  </div>
  <div class="col-md-3">
    <div class="summary-card">
      <div class="summary-icon" style="background:#FFF7ED;color:#EA580C;"><i class="bi bi-people"></i></div>
      <div><div class="val">—</div><div class="lbl">สมาชิกทั้งหมด</div></div>
    </div>
  </div>
  <div class="col-md-3">
    <div class="summary-card">
      <div class="summary-icon" style="background:#FDF4FF;color:#9333EA;"><i class="bi bi-calendar-check"></i></div>
      <div><div class="val">—</div><div class="lbl">การจองทั้งหมด</div></div>
    </div>
  </div>
</div>
{% endblock %}
