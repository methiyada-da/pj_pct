<!-- ── Topbar ── -->
<div class="topbar">
  <!-- hamburger: แสดงเฉพาะ mobile -->
  <button class="sidebar-toggle-btn d-lg-none" id="sidebarToggleBtn" type="button" aria-label="เปิดเมนู">
    <i class="bi bi-list"></i>
  </button>

  <a href="{% url 'admin_panel:dashboard' %}" class="topbar-brand">
    <div class="brand-icon"><i class="bi bi-mortarboard-fill"></i></div>
    <span class="d-none d-sm-inline">Puean Chuay Tu</span>
  </a>
  <div class="topbar-title d-none d-md-block">{{ topbar_breadcrumb|safe }}</div>
  <div class="topbar-actions">
    <!-- Bell Notification Dropdown -->
    <div class="dropdown">
      <button class="topbar-icon-btn position-relative"
              id="adminNotifBell"
              data-bs-toggle="dropdown"
              aria-expanded="false">
        <i class="bi bi-bell"></i>
        <span id="admin-notif-badge"
              class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger d-none"
              style="font-size:0.6rem">0</span>
      </button>
      <ul class="dropdown-menu dropdown-menu-end shadow p-0"
          style="min-width:300px;max-width:92vw;max-height:460px;overflow-y:auto;">
        <li class="px-3 py-2 border-bottom d-flex justify-content-between align-items-center"
            style="position:sticky;top:0;background:#fff;z-index:1;">
          <span class="fw-semibold" style="font-size:13px;">การแจ้งเตือน</span>
          <a href="#" style="font-size:12px;" class="text-primary text-decoration-none"
             onclick="adminMarkAllRead(event)">อ่านทั้งหมด</a>
        </li>
        <li id="admin-notif-empty" class="px-3 py-3 text-center text-muted" style="font-size:13px;">
          ไม่มีการแจ้งเตือน
        </li>
      </ul>
    </div>
    <a href="{% url 'messaging:inbox' %}" class="topbar-icon-btn">
      <i class="bi bi-chat-dots"></i>
    </a>
  </div>
</div>
