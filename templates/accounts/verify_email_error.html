{% extends 'accounts/auth_base.html' %}

{% block auth_card %}
<div class="auth-card shadow-lg text-center" style="max-width:480px;margin:0 auto;padding:2.5rem;">
  <div class="mb-3" style="font-size:48px;">⚠️</div>
  <h4 class="auth-heading">ยืนยันอีเมลไม่สำเร็จ</h4>
  <p class="text-muted mb-4">{{ error }}</p>
  <a href="{% url 'accounts:register' %}" class="btn btn-primary w-100">
    <i class="fas fa-user-plus me-2"></i>สมัครสมาชิกใหม่
  </a>
  <div style="height:10px;"></div>
  <a href="{% url 'accounts:login' %}" class="btn btn-outline-secondary w-100">
    <i class="fas fa-sign-in-alt me-2"></i>เข้าสู่ระบบ
  </a>
</div>
{% endblock %}
