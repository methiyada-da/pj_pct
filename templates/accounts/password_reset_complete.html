{% extends 'accounts/auth_base.html' %}

{% block auth_card %}
<div class="auth-card shadow-lg text-center" style="max-width:480px;margin:0 auto;padding:2.5rem;">

  <h4 class="auth-heading">รีเซ็ตรหัสผ่านสำเร็จ!</h4>
  <p class="text-muted mb-4">รหัสผ่านของคุณถูกเปลี่ยนเรียบร้อยแล้ว สามารถเข้าสู่ระบบด้วยรหัสผ่านใหม่ได้เลย</p>

  </a>
</div>
{% endblock %}
